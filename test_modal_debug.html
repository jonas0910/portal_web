<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Modal Aniversario</title>
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>Test Modal de Aniversario</h1>
        <p>Esta página prueba si el modal funciona correctamente.</p>
        
        <button class="btn btn-primary" onclick="abrirModal()">Abrir Modal Manualmente</button>
        
        <div class="mt-3">
            <h3>Verificaciones:</h3>
            <ul id="verificaciones"></ul>
        </div>
    </div>

    <!-- Modal de prueba -->
    <div class="modal fade" id="modalFotosAniversario" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">
                        <i class="fas fa-birthday-cake"></i> Galería de Aniversario (PRUEBA)
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="alert alert-success">
                        ✅ ¡El modal funciona correctamente!
                    </div>
                    <p>Si ves este mensaje, el modal puede abrirse.</p>
                    <p><strong>Problema:</strong> La configuración de auto-apertura o las fotos.</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Botón flotante -->
    <button type="button" class="btn btn-primary" id="btn-abrir-galeria" 
            data-bs-toggle="modal" data-bs-target="#modalFotosAniversario"
            style="position: fixed; bottom: 20px; right: 20px; border-radius: 50%; width: 60px; height: 60px; box-shadow: 0 4px 8px rgba(0,0,0,0.3);">
        <i class="fas fa-birthday-cake fa-lg"></i>
    </button>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Bootstrap 5 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // Lista de verificaciones
        const verificaciones = document.getElementById('verificaciones');
        
        function addCheck(mensaje, ok) {
            const li = document.createElement('li');
            li.innerHTML = (ok ? '✅' : '❌') + ' ' + mensaje;
            li.className = ok ? 'text-success' : 'text-danger';
            verificaciones.appendChild(li);
        }

        // Verificar jQuery
        addCheck('jQuery cargado', typeof $ !== 'undefined');
        
        // Verificar Bootstrap
        addCheck('Bootstrap cargado', typeof bootstrap !== 'undefined');
        
        // Verificar que el modal existe
        const modalEl = document.getElementById('modalFotosAniversario');
        addCheck('Modal existe en el DOM', modalEl !== null);
        
        // Verificar que bootstrap.Modal funciona
        if (modalEl && typeof bootstrap !== 'undefined') {
            try {
                const modal = new bootstrap.Modal(modalEl);
                addCheck('Bootstrap.Modal funciona', true);
            } catch(e) {
                addCheck('Bootstrap.Modal funciona', false);
            }
        }

        // Función para abrir modal
        function abrirModal() {
            const modalEl = document.getElementById('modalFotosAniversario');
            if (modalEl && typeof bootstrap !== 'undefined') {
                const modal = new bootstrap.Modal(modalEl);
                modal.show();
                console.log('✅ Modal abierto manualmente');
            } else {
                alert('❌ Error: No se puede abrir el modal');
            }
        }

        // Simular auto-apertura (con configuración en true)
        const autoAbrir = true; // Simula que la config está en true
        const delay = 1500;

        if (autoAbrir) {
            console.log('⏱️ Esperando ' + delay + 'ms para abrir modal...');
            setTimeout(function() {
                const modalEl = document.getElementById('modalFotosAniversario');
                if (modalEl) {
                    const modal = new bootstrap.Modal(modalEl);
                    modal.show();
                    console.log('✅ Modal abierto automáticamente');
                }
            }, delay);
        }

        console.log('🎯 Página de prueba cargada. El modal debería abrirse en 1.5 segundos.');
    </script>
</body>
</html>
